<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>David Lakubu — Portfolio</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="assets/new_style.css" />

<!-- Page Loader CSS (inline for immediate loading) -->
<style>
  .page-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg) !important;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    overflow: hidden;
  }
  .page-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-container { display: flex; flex-direction: column; align-items: center; gap: 2rem; }
  .spinner-square {
    width: 60px; height: 60px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text {
    font-family: "Readex Pro", sans-serif;
    font-size: 1rem;
    color: var(--ink, #1a1a2e);
    letter-spacing: 0.05em;
  }
</style>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400;1,6..96,700&family=Questrial&family=Readex+Pro:wght@300;400;700&display=swap" rel="stylesheet"/>

<!-- Alpine.js -->
<script
  defer
  src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.4/dist/cdn.min.js"
></script>

<!-- Page Loader (load first, no dependencies) -->
<script src="assets/js/loader.js"></script>

<script src="assets/js/data.js"></script>
<script src="assets/app-alpine.js"></script>
</head>
<body x-data="combinedInit()" :class="themeClass">

<!-- Page Loader -->
<div id="pageLoader" class="page-loader">
  <div class="loader-container">
    <div class="spinner-square"></div>
    <div class="loader-text">Loading...</div>
  </div>
</div>

<div class="masthead">
  <div class="masthead-left" x-text="data ? (roleParts.length ? roleParts[1] + ' · ' + locationText + ' · ' + new Date().getFullYear() : '') : 'Loading...'"></div>
  <div class="masthead-center" x-text="data ? $store.i18n.localize(data.tagline) : 'The Dev Portfolio'"></div>
  <div class="masthead-right">
    <div class="selectors">
      <div class="custom-select" x-data="languageSelector()" @click.outside="open = false">
        <div class="select-selected" :class="{ 'select-arrow-active': open }" @click="open = !open" tabindex="0">
          <span x-text="getLanguageLabel(currentLanguage)"></span>
        </div>
        <div class="select-items" :class="{ 'select-show': open }">
          <template x-for="lang in languages" :key="lang">
            <div :class="{ 'same-as-selected': currentLanguage === lang }" @click="setCurrentLanguage(lang)" x-text="getLanguageLabel(lang)"></div>
          </template>
        </div>
      </div>
      <div class="custom-select" x-data="themeSelector()" @click.outside="open = false">
        <div class="select-selected" :class="{ 'select-arrow-active': open }" @click="open = !open" tabindex="0">
          <span x-text="currentTheme"></span>
        </div>
        <div class="select-items" :class="{ 'select-show': open }">
          <template x-for="themeName in themes" :key="themeName">
            <div :class="{ 'same-as-selected': currentTheme === themeName }" @click="setCurrentTheme(themeName)" x-text="themeName"></div>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="color-bar">
  <div class="cb1"></div><div class="cb2"></div><div class="cb3"></div><div class="cb4"></div>
</div>

<div class="section-nav">
  <div class="nav-profile">
    <img :src="profileImage.src || 'assets/img/profile.png'" :alt="profileImage.alt || 'profile picture'">
  </div>
  <a href="index.html" x-text="$store.i18n.t(&#39;home&#39;)"></a>
  <a href="portfolio.html" x-text="$store.i18n.t(&#39;portfolio&#39;)"></a>
  <a href="posts.html" x-text="$store.i18n.t(&#39;blog&#39;)"></a>
  <a href="tools.html">Tools</a>
  <div class="spacer"></div>
  <a href="https://github.com/davidlakubu" target="_blank"><span x-text="$store.i18n.t(&#39;gitHub&#39;)"></span> →</a>
</div>

<div class="main">

  <!-- Awards Section -->
  <div class="article" x-data="awardsSection()">
    <div class="article-label" x-text="$store.i18n.t('recognition')"></div>
    <div class="article-title" x-text="$store.i18n.t('awardsCertificates')"></div>

    <template x-for="award in awards" :key="award.title.en">
      <div class="work-entry">
        <div class="work-title">
          <template x-if="award.external_url">
            <a :href="award.external_url" target="_blank" rel="noopener noreferrer" style="color: var(--ink); text-decoration: none;">
              <span x-text="$store.i18n.localize(award.title)"></span>
              <span class="external-badge" x-text="award.platform" style="font-size: 0.5rem; margin-left: 6px; padding: 2px 6px; background: var(--border); border-radius: 4px; text-transform: uppercase;"></span>
            </a>
          </template>
          <template x-if="!award.external_url">
            <span x-text="$store.i18n.localize(award.title)"></span>
          </template>
        </div>
        <div class="work-meta" x-text="$store.i18n.localize(award.date) || award.description?.date"></div>
        <div class="work-desc" x-text="$store.i18n.localize(award.description)"></div>
      </div>
    </template>
  </div>
  <!-- Work Experience -->
  <div class="article" id="experience" x-data="workExperienceSection()">
    <div class="article-label" x-text="$store.i18n.t('career')"></div>
    <div class="article-title" x-text="$store.i18n.t('workExperiences')"></div>

    <template x-for="exp in experiences" :key="exp.title">
      <div class="work-entry">
        <div class="work-title" x-text="exp.title"></div>
        <div class="work-meta" x-text="exp.duration"></div>
        <div class="work-desc" x-html="$store.i18n.localize(exp.description)"></div>
        <div class="work-stack">
          <template x-for="tech in exp.tech_used" :key="tech">
            <span class="stack-item" x-text="tech"></span>
          </template>
        </div>
        <div class="work-links">
          <template x-for="link in exp.links" :key="link.url">
            <a :href="link.url" class="work-link" target="_blank" x-text="link.name"></a>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Sidebar skills -->
  <div class="sidebar" id="skills" x-data="skillsSection()">
    <div class="sidebar-block">
      <div class="sidebar-title" x-text="$store.i18n.t('languages')"></div>
      <template x-for="(lang, index) in languageSkills" :key="index">
        <div class="sidebar-item" x-text="lang"></div>
      </template>
    </div>
    <div class="sidebar-block">
      <div class="sidebar-title" x-text="$store.i18n.t('librariesTools')"></div>
      <template x-for="(item, index) in librariesAndTools" :key="index">
